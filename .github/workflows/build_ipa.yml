name: Build VisionClaw IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clear Code Signing Settings
      run: |
        cd samples/CameraAccess
        sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/' CameraAccess.xcodeproj/project.pbxproj
        sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/' CameraAccess.xcodeproj/project.pbxproj

    - name: Build Project for Generic Device
      run: |
        cd samples/CameraAccess
        xcodebuild clean build \
          -project CameraAccess.xcodeproj \
          -scheme CameraAccess \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CONFIGURATION_BUILD_DIR=build

    - name: Package into IPA Archive
      run: |
        cd samples/CameraAccess/build
        mkdir Payload
        cp -r CameraAccess.app Payload/
        zip -r VisionClaw.ipa Payload

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: vision-claw-ipa
        path: samples/CameraAccess/build/VisionClaw.ipa
