name: Build VisionClaw IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Force Disable Signing Requirements
      run: |
        cd samples/CameraAccess
        sed -i '' 's/CODE_SIGNING_REQUIRED = YES/CODE_SIGNING_REQUIRED = NO/g' CameraAccess.xcodeproj/project.pbxproj
        sed -i '' 's/CODE_SIGNING_ALLOWED = YES/CODE_SIGNING_ALLOWED = NO/g' CameraAccess.xcodeproj/project.pbxproj
        sed -i '' 's/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = "";/g' CameraAccess.xcodeproj/project.pbxproj

    - name: Archive and Export App Bundle
      run: |
        cd samples/CameraAccess
        xcodebuild archive \
          -project CameraAccess.xcodeproj \
          -scheme CameraAccess \
          -archivePath ./build/VisionClaw.xcarchive \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE_SPECIFIER=""

    - name: Package App Bundle into IPA
      run: |
        cd samples/CameraAccess
        mkdir -p build/Payload
        cp -r build/VisionClaw.xcarchive/Products/Applications/CameraAccess.app build/Payload/
        cd build
        zip -r VisionClaw.ipa Payload

    - name: Upload Finished IPA
      uses: actions/upload-artifact@v4
      with:
        name: vision-claw-ipa
        path: samples/CameraAccess/build/VisionClaw.ipa
